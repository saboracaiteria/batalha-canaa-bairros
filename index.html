<!DOCTYPE html>
<html lang="pt-pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Residencial Canaã - Tactical Survival FPS Game optimizado para mobile">
    <meta name="theme-color" content="#fcee0a">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <title>Residencial Canaã - Tactical Survival</title>
    <style>
        :root {
            --ui-primary: #fcee0a;
            --ui-cyan: #00f3ff;
            --ui-red: #ff003c;
            --ui-bg: #0a0a0a;
            --ui-armor: #00d4ff;
            --ui-danger: #ff003c;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--ui-bg);
            font-family: 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #game-container {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: none;
            background: #87CEEB;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }

        .overlay-screen {
            position: fixed;
            inset: 0;
            background: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            color: white;
            z-index: 1000;
            text-align: center;
            padding: 40px 20px;
            overflow-y: auto;
        }

        .overlay-screen::after {
            content: "";
            position: absolute;
            inset: 15px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            pointer-events: none;
            z-index: 2;
            clip-path: polygon(0 0, 10% 0, 10% 2px, 0 2px, 0 0, 100% 0, 100% 10%, calc(100% - 2px) 10%, calc(100% - 2px) 0, 100% 0, 100% 100%, 90% 100%, 90% calc(100% - 2px), 100% calc(100% - 2px), 100% 100%, 0 100%, 0 90%, 2px 90%, 2px 100%, 0 100%);
        }

        .cyber-title-container {
            margin-bottom: 40px;
            position: relative;
            z-index: 10;
        }

        .cyber-title {
            font-size: clamp(1.8rem, 8vw, 3.5rem);
            color: var(--ui-primary);
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 3px 3px 0px var(--ui-red);
            font-style: italic;
        }

        .cyber-subtitle {
            font-size: 0.8rem;
            letter-spacing: 8px;
            color: var(--ui-cyan);
            text-transform: uppercase;
            font-weight: bold;
            margin-top: -5px;
            text-shadow: 1px 1px 2px black;
        }

        .config-box {
            width: 95%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            z-index: 5;
        }

        .menu-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            justify-content: center;
        }

        .tab-btn {
            padding: 8px 15px;
            background: transparent;
            color: #666;
            border: 1px solid #333;
            font-size: 0.7rem;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        .tab-btn.active {
            color: #000;
            background: var(--ui-primary);
            border-color: var(--ui-primary);
        }

        .field {
            display: flex;
            flex-direction: column;
            text-align: left;
            margin-bottom: 5px;
        }

        .field label {
            font-size: 0.65rem;
            font-weight: 900;
            color: var(--ui-cyan);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .field input,
        .field select {
            padding: 12px;
            border: none;
            background: #111;
            color: white;
            font-size: 0.9rem;
            border-left: 4px solid var(--ui-red);
            outline: none;
            transition: 0.3s;
            font-family: monospace;
        }

        .field input:focus {
            background: #1a1a1a;
            border-left-color: var(--ui-primary);
        }

        .btn-main {
            width: 100%;
            padding: 16px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 2px;
            background: var(--ui-primary);
            color: #000;
            clip-path: polygon(15px 0, 100% 0, calc(100% - 15px) 100%, 0 100%);
            margin-top: 10px;
        }

        .btn-main:hover {
            transform: scale(1.03);
            filter: brightness(1.1);
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        .mode-selector {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .mode-btn.active {
            border-color: var(--ui-primary);
            color: var(--ui-primary);
        }

        .hidden {
            display: none !important;
        }

        .dev-footer {
            margin-top: auto;
            font-size: 0.6rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .dev-footer a {
            color: var(--ui-cyan);
            text-decoration: none;
            pointer-events: auto;
        }

        #hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            display: none;
        }

        .hud-el {
            position: absolute;
            background: rgba(0, 0, 0, 0.3);
            border: 2.5px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            backdrop-filter: blur(8px);
            pointer-events: auto;
            touch-action: none;
            box-sizing: border-box;
            text-align: center;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 32px;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
        }

        #crosshair-dot {
            width: 6px;
            height: 6px;
            background: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff0000, 0 0 2px #fff;
        }

        #joy-zone {
            bottom: 40px;
            left: 40px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        #joy-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
        }

        #btn-jump {
            bottom: 140px;
            right: 160px;
            width: 80px;
            height: 80px;
        }

        #btn-fire-ads {
            bottom: 40px;
            right: 40px;
            width: 125px;
            height: 125px;
            border-color: var(--ui-danger);
            font-size: 20px;
            background: radial-gradient(circle, rgba(255, 68, 68, 0.3) 0%, rgba(0, 0, 0, 0.2) 70%);
        }
    </style>
</head>

<body>

    <div id="game-container"></div>

    <div id="start-screen" class="overlay-screen">
        <div class="cyber-title-container">
            <h1 class="cyber-title">RESIDENCIAL CANAÃ</h1>
            <div class="cyber-subtitle">TACTICAL SURVIVAL</div>
        </div>

        <div class="config-box">
            <div class="menu-tabs">
                <button class="tab-btn active" onclick="switchTab('play')">PARTIDA</button>
                <button class="tab-btn" onclick="switchTab('multi')">MULTIPLAYER</button>
                <button class="tab-btn" onclick="switchTab('opts')">OPÇÕES</button>
            </div>

            <div id="tab-play" class="full grid" style="display: contents;">
                <div class="field">
                    <label>// NOME DO OPERADOR</label>
                    <input type="text" id="player-name" placeholder="DIGITE SEU NOME..." maxlength="12">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="field">
                        <label>// Nº SOLDADOS (BOTS)</label>
                        <input type="number" id="bot-count" value="10" min="0" max="30">
                    </div>
                    <div class="field">
                        <label>// DIFICULDADE</label>
                        <select id="bot-diff">
                            <option value="1">Casual</option>
                            <option value="2" selected>Normal</option>
                            <option value="3">Veterano</option>
                        </select>
                    </div>
                </div>

                <label
                    style="font-size: 0.65rem; color: var(--ui-cyan); text-align: left; font-weight: 900; margin-bottom: -10px;">//
                    MODO DE COMBATE</label>
                <div class="mode-selector">
                    <button class="mode-btn active" onclick="setMode('solo', this)">SOLO</button>
                    <button class="mode-btn" onclick="setMode('duo', this)">DUO</button>
                    <button class="mode-btn" onclick="setMode('squad', this)">SQUAD</button>
                </div>

                <button class="btn-main" onclick="initGame('solo')">[ INICIAR SINGLE PLAYER ]</button>
            </div>

            <div id="tab-multi" class="full grid hidden" style="display: contents;">
                <p style="color: var(--ui-cyan); font-size: 0.75rem;">MULTIPLAYER EM CONSTRUÇÃO</p>
            </div>

            <div id="tab-opts" class="full grid hidden" style="display: contents;">
                <div class="field">
                    <label>// QUALIDADE GRÁFICA</label>
                    <select id="cfg-graphics">
                        <option value="low" selected>DESEMPENHO (CELULAR FRACO)</option>
                        <option value="high">QUALIDADE (CELULAR FORTE)</option>
                    </select>
                </div>

                <div class="field">
                    <label>// SENSIBILIDADE [<span id="val-sens-start">55</span>]</label>
                    <input type="range" id="cfg-sens" min="1" max="100" value="55"
                        oninput="document.getElementById('val-sens-start').innerText=this.value">
                </div>
                <div class="field">
                    <label>// FOV [<span id="val-fov-start">75</span>]</label>
                    <input type="range" id="cfg-fov" min="40" max="100" value="75"
                        oninput="document.getElementById('val-fov-start').innerText=this.value">
                </div>

                <button class="btn-main" style="background: var(--ui-red); color: white; margin-top: 20px;"
                    onclick="openHudEditor()">
                    🎨 CUSTOMIZAR INTERFACE (HUD)
                </button>
            </div>
        </div>

        <div class="dev-footer">
            // DEVELOPER: <a href="https://www.instagram.com/_nildoxz/" target="_blank">_nildoxz</a><br>
            CANAÃ DOS CARAJÁS - 2026 | OPTIMIZED (+60 FPS)
        </div>
    </div>

    <div id="hud">
        <!-- Crosshair -->
        <div id="crosshair">
            <div id="crosshair-dot"></div>
        </div>

        <!-- Mobile Controls -->
        <div id="btn-jump" class="hud-el">SALTAR</div>
        <div id="btn-fire-ads" class="hud-el">TIRO<br>ADS</div>
        <div id="joy-zone" class="hud-el">
            <div id="joy-knob"></div>
        </div>

        <!-- Weapon & Grenade Buttons (original style) -->
        <div id="btn-weapon" class="hud-el"
            style="bottom: 300px; left: 160px; width: 80px; height: 80px; background: rgba(255,234,10,0.3); border-color: #fcee0a;">
            ARMA<br><span style="font-size: 8px;">(FUSE)</span>
        </div>
        <div id="btn-grenade" class="hud-el"
            style="bottom: 390px; left: 160px; width: 80px; height: 80px; background: rgba(0,212,255,0.3); border-color: #00d4ff;">
            BOMBA<br><span style="font-size: 8px;">(EXPL)</span>
        </div>

        <!-- Additional Buttons -->
        <div id="btn-reload" class="hud-el"
            style="bottom: 200px; left: 85px; width: 70px; height: 70px; background: rgba(255,255,255,0.1); font-size: 9px;">
            🔄<br>RELOAD
        </div>
        <div id="btn-hip" class="hud-el"
            style="bottom: 250px; right: 180px; width: 90px; height: 90px; background: rgba(255,255,255,0.1); font-size: 10px;">
            TIRO<br>HIP
        </div>

        <!-- Health & Armor Bars -->
        <div style="position: absolute; bottom: 20px; left: 20px; width: 200px; pointer-events: none;">
            <div style="margin-bottom: 8px;">
                <div style="font-size: 10px; color: #fff; margin-bottom: 3px; text-shadow: 1px 1px 2px black;">VIDA
                </div>
                <div
                    style="width: 100%; height: 18px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.3); overflow: hidden;">
                    <div id="hp-bar"
                        style="width: 100%; height: 100%; background: linear-gradient(90deg, #ff0000, #ff6b6b); transition: width 0.3s;">
                    </div>
                </div>
            </div>
            <div>
                <div style="font-size: 10px; color: #fff; margin-bottom: 3px; text-shadow: 1px 1px 2px black;">ARMADURA
                </div>
                <div
                    style="width: 100%; height: 18px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.3); overflow: hidden;">
                    <div id="armor-bar"
                        style="width: 100%; height: 100%; background: linear-gradient(90deg, #00d4ff, #6bddff); transition: width 0.3s;">
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats (Top Right) -->
        <div style="position: absolute; top: 20px; right: 20px; text-align: right; pointer-events: none;">
            <div
                style="font-size: 16px; color: #fcee0a; font-weight: bold; text-shadow: 2px 2px 4px black; margin-bottom: 8px;">
                <span style="color: #fff; font-size: 12px;">KILLS:</span> <span id="count-kills">0</span>
            </div>
            <div style="font-size: 14px; color: #fff; font-weight: bold; text-shadow: 2px 2px 4px black;">
                <span style="color: #aaa; font-size: 11px;">VIVOS:</span> <span id="count-alive">10</span>
            </div>
        </div>

        <!-- Minimap -->
        <div style="position: absolute; top: 20px; left: 20px; pointer-events: none;">
            <canvas id="minimap-canvas" width="100" height="100"
                style="border: 2px solid rgba(255,255,255,0.4); background: rgba(10,20,40,0.8); border-radius: 4px;"></canvas>
        </div>

        <!-- Kill Log -->
        <div id="kill-log"
            style="position: absolute; top: 100px; right: 20px; width: 250px; pointer-events: none; font-size: 12px; text-align: right;">
        </div>

        <!-- Ammo Counter -->
        <div style="position: absolute; bottom: 20px; right: 20px; pointer-events: none; text-align: right;">
            <div style="font-size: 24px; color: #fcee0a; font-weight: bold; text-shadow: 2px 2px 4px black;">
                <span id="ammo-count">30/180</span>
            </div>
            <div style="font-size: 12px; color: #aaa; margin-top: -5px;">MUNIÇÃO</div>
        </div>
    </div>

    <!-- ES Module Import -->
    <script type="module" src="./src/main.js"></script>

    <!-- Utility Functions -->
    <script>
        // Tab switching
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('[onclick*="switchTab"]').forEach(btn => {
                if (btn.onclick.toString().includes(`'${tab}'`)) {
                    btn.classList.add('active');
                }
            });

            document.getElementById('tab-play').classList.add('hidden');
            document.getElementById('tab-multi').classList.add('hidden');
            document.getElementById('tab-opts').classList.add('hidden');

            if (tab === 'play') document.getElementById('tab-play').classList.remove('hidden');
            if (tab === 'multi') document.getElementById('tab-multi').classList.remove('hidden');
            if (tab === 'opts') document.getElementById('tab-opts').classList.remove('hidden');
        }

        // Game mode selection
        let selectedMode = 'solo';
        function setMode(mode, btn) {
            selectedMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>

</body>

</html>
